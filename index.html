<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18834a"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Faktura"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="./icon.svg"><title>Faktura — управление ремонтом</title>
<style>
:root{--bg:#f5f6f4;--paper:#fff;--ink:#18211c;--muted:#778179;--line:#e8ece8;--green:#18834a;--green2:#e8f5ed;--red:#c2483b;--amber:#a06a13;--shadow:0 8px 24px #15251b0a;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:#fff;border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;z-index:3}.brand{display:flex;align-items:center;gap:10px;padding:0 10px 28px;font-size:21px;font-weight:750;letter-spacing:-.5px}.logo{height:34px;width:34px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;color:#647068;padding:11px 12px;border-radius:11px;font-weight:550}.nav button:hover,.nav button.active{background:var(--green2);color:var(--green)}.nav .ico{display:inline-grid;width:26px;font-size:17px}.sidebottom{margin-top:auto;color:var(--muted);font-size:12px;padding:12px}.main{margin-left:248px;max-width:1440px;padding:30px 38px 70px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:26px}.eyebrow{color:var(--muted);font-size:13px;margin-bottom:5px}.title{font-size:28px;line-height:1.2;letter-spacing:-.7px;margin:0;font-weight:720}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:600}.btn:hover{border-color:#cbd7ce}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.soft{background:var(--green2);color:var(--green);border-color:transparent}.btn.danger{color:var(--red)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.stat{padding:18px 20px}.stat label{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:24px;letter-spacing:-.5px;margin-top:8px}.stat small{font-size:12px;color:var(--muted)}.cols{grid-template-columns:1.25fr .75fr;align-items:start}.section{padding:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.sectionhead h2{font-size:17px;margin:0;letter-spacing:-.25px}.sectionhead a,.textbtn{color:var(--green);font-weight:650;text-decoration:none;border:0;background:none;padding:4px}.objlist{display:grid;gap:10px}.object{border:1px solid var(--line);border-radius:13px;padding:15px 16px;cursor:pointer;transition:.15s}.object:hover{border-color:#b7d8c2;transform:translateY(-1px)}.objtop{display:flex;justify-content:space-between;gap:12px}.objname{font-weight:650}.badge{font-size:11px;color:var(--green);background:var(--green2);padding:4px 8px;border-radius:99px;white-space:nowrap}.badge.gray{background:#f1f3f1;color:#677169}.objmeta{display:flex;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:10px}.objmeta b{color:#343e37;font-weight:600}.rows{display:grid}.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.dot{width:32px;height:32px;border-radius:10px;background:#f2f4f2;display:grid;place-items:center}.rowmain{min-width:0}.rowtitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);margin-top:3px}.amount{font-weight:700;white-space:nowrap}.amount.in{color:var(--green)}.amount.out{color:var(--red)}.taskcheck{width:18px;height:18px;border:1.5px solid #b8c2ba;border-radius:6px;background:white}.taskdone .rowtitle{text-decoration:line-through;color:var(--muted)}.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:14px}.view{display:none}.view.active{display:block}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select{width:auto;min-width:160px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:13px;font-weight:600;color:#465149}.field input,.field select,.field textarea,.filters input,.filters select{border:1px solid #dfe5e0;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);width:100%;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#63ad7e;box-shadow:0 0 0 3px #18834a16}.field textarea{resize:vertical;min-height:78px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.span2{grid-column:span 2}.modalback{position:fixed;inset:0;background:#111a14a6;z-index:10;display:none;align-items:center;justify-content:center;padding:16px}.modalback.show{display:flex}.modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 24px 70px #0003}.modal h2{font-size:20px;margin:0 0 18px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{padding:13px 15px;border-radius:12px;background:#f1f7f3;color:#45634e;font-size:13px;margin-bottom:16px}.detailhero{padding:22px;margin-bottom:16px}.detailhero h2{margin:0;font-size:22px}.detailgrid{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px}.detailstat{background:#f7f9f7;border-radius:12px;padding:12px}.detailstat small{display:block;color:var(--muted)}.detailstat b{display:block;margin-top:4px}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:12px 0 4px;overflow:auto}.tabs button{border:0;background:transparent;padding:11px 12px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}.tabs button.active{color:var(--green);border-color:var(--green);font-weight:650}.mobilebar{display:none}.hide{display:none!important}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#17231b;color:#fff;padding:11px 16px;border-radius:11px;z-index:20;box-shadow:var(--shadow)}
@media(max-width:980px){.sidebar{width:210px}.main{margin-left:210px;padding:25px 24px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}}
@media(max-width:650px){body{font-size:14px}.sidebar{display:none}.main{margin:0;padding:22px 16px 90px}.top{align-items:flex-start;margin-bottom:20px}.title{font-size:24px}.actions .secondary-mobile{display:none}.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:20px}.stat label{font-size:12px}.section{padding:16px}.mobilebar{display:grid;position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.mobilebar button{border:0;background:transparent;color:#758078;font-size:10px;padding:4px 0;display:grid;justify-items:center;gap:2px}.mobilebar button span{font-size:18px}.mobilebar button.active{color:var(--green);font-weight:650}.row{grid-template-columns:32px minmax(0,1fr);gap:9px}.amount{grid-column:2;justify-self:start;font-size:14px}.row{align-items:start}.row .rowmain{padding-top:1px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.detailgrid{grid-template-columns:1fr 1fr}.objmeta{gap:8px 14px}.btn{padding:9px 11px}.filters input,.filters select{flex:1;min-width:130px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="logo">Ф</span> Faktura</div><nav class="nav" id="sidenav"></nav><div class="sidebottom">Управление ремонтными объектами<br>Работает офлайн · облако подключается отдельно</div></aside><main class="main"><div class="top"><div><div class="eyebrow" id="crumb">Рабочий стол</div><h1 class="title" id="pageTitle">Обзор</h1></div><div class="actions" id="topActions"></div></div><section id="dashboard" class="view active"></section><section id="objects" class="view"></section><section id="finance" class="view"></section><section id="tasks" class="view"></section><section id="notes" class="view"></section><section id="directory" class="view"></section><section id="objectDetail" class="view"></section></main><nav class="mobilebar" id="mobilebar"></nav></div><div class="modalback" id="modalback"><div class="modal" id="modal"></div></div><div id="toast" class="toast hide"></div>
<script>
(()=>{'use strict';const KEY='faktura_v1_data';const navItems=[['dashboard','⌂','Обзор'],['objects','▦','Объекты'],['finance','↕','Финансы'],['tasks','☑','Задачи'],['notes','▤','Заметки'],['directory','♙','Справочники']];const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(n)||0);const dateFmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'}):'Без срока';const today=()=>new Date().toISOString().slice(0,10);let data=load(), current='dashboard', detailId=null, detailTab='finance', filters={};function seed(){let d=today();return{objects:[{id:id(),name:'Квартира на Лесной',type:'client',address:'ул. Лесная, 14',contract:1250000,purchase:0,expectedSale:0,created:d,archived:false},{id:id(),name:'Квартира на Набережной',type:'own',address:'наб. Речная, 8',contract:0,purchase:6800000,expectedSale:8200000,created:d,archived:false}],people:['Алексей (прораб)','Иван Петров'],counterparties:['СтройМаркет','ООО «Мастер»'],transactions:[],tasks:[{id:id(),title:'Согласовать раскладку плитки',objectId:'',due:d,person:'Алексей (прораб)',status:'todo',created:d}],notes:[],};}function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch{return seed()}}function save(){localStorage.setItem(KEY,JSON.stringify(data));render();queueCloudSync()}function id(){return Math.random().toString(36).slice(2,10)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function obj(id){return data.objects.find(x=>x.id===id)}function txs(oid){return data.transactions.filter(t=>!oid||t.objectId===oid)}function total(list,type){return list.filter(x=>x.type===type).reduce((n,x)=>n+Number(x.amount||0),0)}function expense(list){return total(list,'expense')}function income(list){return total(list,'income')}function cash(list){return income(list)-expense(list)}function activeObjects(){return data.objects.filter(o=>!o.archived)}function nav(){let html=navItems.map(([k,i,t])=>`<button data-go="${k}" class="${current===k?'active':''}"><span class="ico">${i}</span>${t}</button>`).join('');document.getElementById('sidenav').innerHTML=html;document.getElementById('mobilebar').innerHTML=navItems.slice(0,5).map(([k,i,t])=>`<button data-go="${k}" class="${current===k?'active':''}"><span>${i}</span>${t}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));}function go(page){current=page;detailId=null;render()}function openObject(oid,tab='finance'){detailId=oid;detailTab=tab;current='objectDetail';render()}function header(title,crumb,actions=''){document.getElementById('pageTitle').textContent=title;document.getElementById('crumb').textContent=crumb;document.getElementById('topActions').innerHTML=actions;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(current).classList.add('active');nav()}function btn(label,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${label}</button>`}function bindActions(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action))}function showToast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),2200)}function action(a){if(a==='new-object')objectForm();else if(a==='new-tx')txForm();else if(a==='new-task')taskForm();else if(a==='new-note')noteForm();else if(a==='new-person')directoryForm('people');else if(a==='new-counterparty')directoryForm('counterparties');else if(a==='export')exportData();else if(a==='sync-settings')cloudForm();else if(a==='cloud-signin')cloudAuth('signin');else if(a==='cloud-signup')cloudAuth('signup');else if(a==='cloud-push')cloudTransfer('push');else if(a==='cloud-pull')cloudTransfer('pull');else if(a==='cloud-signout')cloudSignout();else if(a==='backup')backup();else if(a==='restore')document.getElementById('fileRestore').click();else if(a==='close')closeModal();else if(a==='archive'){let o=obj(detailId);o.archived=!o.archived;save();showToast(o.archived?'Объект перемещён в архив':'Объект восстановлен')}else if(a==='tab'){detailTab=document.querySelector('[data-tab="'+a+'"]')?.dataset.value||detailTab} else if(a.startsWith('dtab:')){detailTab=a.split(':')[1];render()}else if(a.startsWith('edit-object:'))objectForm(a.split(':')[1]);else if(a.startsWith('tx:'))txForm(a.slice(3));else if(a.startsWith('task:'))toggleTask(a.slice(5));else if(a.startsWith('del-note:'))deleteNote(a.slice(9));else if(a.startsWith('edit-note:'))noteForm(a.slice(10));else if(a.startsWith('arch:')){data.objects.find(o=>o.id===a.slice(5)).archived=true;save()}else if(a.startsWith('restore:')){data.objects.find(o=>o.id===a.slice(8)).archived=false;save()}}
function render(){const acts={'dashboard':`${btn('＋ Операция','new-tx','primary')}${btn('＋ Объект','new-object','secondary-mobile')}`,'objects':`${btn('＋ Новый объект','new-object','primary')}`,'finance':`${btn('＋ Операция','new-tx','primary')}`,'tasks':`${btn('＋ Задача','new-task','primary')}`,'notes':`${btn('＋ Заметка','new-note','primary')}`,'directory':`${btn('＋ Человек','new-person','')}${btn('＋ Контрагент','new-counterparty','primary')}`,'objectDetail':`${btn('＋ Операция','new-tx','primary')}${btn('Изменить','edit-object:'+detailId)}`};header(({dashboard:'Обзор',objects:'Объекты',finance:'Финансы',tasks:'Задачи',notes:'Заметки',directory:'Справочники',objectDetail:(obj(detailId)?.name||'Объект')})[current],current==='objectDetail'?'Объекты': 'Faktura',acts[current]||'');if(current==='dashboard')renderDashboard();if(current==='objects')renderObjects();if(current==='finance')renderFinance();if(current==='tasks')renderTasks();if(current==='notes')renderNotes();if(current==='directory')renderDirectory();if(current==='objectDetail')renderDetail();bindActions()}
function stat(label,value,note=''){return `<div class="card stat"><label>${label}</label><strong>${value}</strong>${note?`<small>${note}</small>`:''}</div>`}function objectCard(o){let list=txs(o.id),inc=income(list),ex=expense(list);return `<article class="object" data-object="${o.id}"><div class="objtop"><div class="objname">${esc(o.name)}</div><span class="badge ${o.archived?'gray':''}">${o.archived?'Архив':o.type==='client'?'Ремонт для клиента':'Своя квартира'}</span></div><div class="objmeta"><span>Договор <b>${money(o.contract)}</b></span><span>Получено <b>${money(inc)}</b></span><span>Расходы <b>${money(ex)}</b></span><span>Движение <b>${money(inc-ex)}</b></span></div></article>`}function renderDashboard(){let list=txs(),ts=data.tasks.filter(t=>t.status!=='done'),os=activeObjects();document.getElementById('dashboard').innerHTML=`<div class="grid stats">${stat('Активные объекты',os.length)}${stat('Доходы',money(income(list)))}${stat('Расходы',money(expense(list)))}${stat('Движение денег',money(cash(list)),'Доходы минус расходы')}</div><div class="grid cols"><div class="card section"><div class="sectionhead"><h2>Объекты</h2><a href="#" data-go="objects">Все объекты →</a></div><div class="objlist">${os.slice(0,5).map(objectCard).join('')||'<div class="empty">Добавьте первый объект</div>'}</div></div><div class="card section"><div class="sectionhead"><h2>Ближайшие задачи</h2><a href="#" data-go="tasks">Все задачи →</a></div>${taskRows(ts.slice().sort((a,b)=>(a.due||'').localeCompare(b.due||'')).slice(0,5))}</div></div><div class="card section" style="margin-top:16px"><div class="sectionhead"><h2>Последние операции</h2><a href="#" data-go="finance">Весь журнал →</a></div>${txRows(data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6))}</div>`;document.querySelectorAll('[data-object]').forEach(e=>e.onclick=()=>openObject(e.dataset.object));document.querySelectorAll('[data-go]').forEach(e=>e.onclick=x=>{x.preventDefault();go(e.dataset.go)})}
function renderObjects(){let os=data.objects.filter(o=>filters.showArchived||!o.archived);document.getElementById('objects').innerHTML=`<div class="filters"><input id="objectSearch" placeholder="Найти объект" value="${esc(filters.objectSearch||'')}"><select id="archFilter"><option value="">Активные</option><option value="all" ${filters.showArchived?'selected':''}>Включая архив</option></select></div><div class="objlist" id="objectList">${os.map(o=>objectCard(o)+`<div style="height:8px"></div>`).join('')||'<div class="card empty">Объектов пока нет. Добавьте первый ремонт.</div>'}</div>`;document.querySelectorAll('[data-object]').forEach(e=>e.onclick=()=>openObject(e.dataset.object));document.getElementById('objectSearch').oninput=e=>{filters.objectSearch=e.target.value;document.querySelectorAll('#objectList .object').forEach(card=>card.style.display=card.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'':'none')};document.getElementById('archFilter').onchange=e=>{filters.showArchived=e.target.value==='all';renderObjects();bindActions()}}
function txRows(list){return `<div class="rows">${list.map(t=>{let o=obj(t.objectId);return `<div class="row"><div class="dot">${t.type==='income'?'↙':'↗'}</div><div class="rowmain"><div class="rowtitle">${esc(t.purpose||t.category)}</div><div class="sub">${dateFmt(t.date)} · ${esc(t.category)}${o?` · <a href="#" data-open="${o.id}" style="color:var(--green);text-decoration:none">${esc(o.name)}</a>`:''}${t.counterparty?` · ${esc(t.counterparty)}`:''}</div></div><div class="amount ${t.type==='income'?'in':'out'}">${t.type==='income'?'+':'−'} ${money(t.amount)}</div></div>`}).join('')||'<div class="empty">Операций пока нет</div>'}</div>`}function renderFinance(){let l=data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('finance').innerHTML=`<div class="grid stats">${stat('Доходы',money(income(l)))}${stat('Расходы',money(expense(l)))}${stat('Движение денег',money(cash(l)))}${stat('Операции',l.length)}</div><div class="card section"><div class="filters"><select id="txObject"><option value="">Все объекты</option>${data.objects.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select><select id="txType"><option value="">Доходы и расходы</option><option value="income">Доход</option><option value="expense">Расход</option></select><input id="txSearch" placeholder="Поиск по назначению"></div><div id="txList">${txRows(l)}</div></div>`;const filter=()=>{let oid=document.getElementById('txObject').value,typ=document.getElementById('txType').value,q=document.getElementById('txSearch').value.toLowerCase();document.getElementById('txList').innerHTML=txRows(l.filter(t=>(!oid||t.objectId===oid)&&(!typ||t.type===typ)&&(!q||(t.purpose+' '+t.category+' '+t.counterparty).toLowerCase().includes(q))));bindOpen()};['txObject','txType','txSearch'].forEach(x=>document.getElementById(x).oninput=filter);bindOpen()}function bindOpen(){document.querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openObject(a.dataset.open)})}
function taskRows(list){return `<div class="rows">${list.map(t=>`<div class="row ${t.status==='done'?'taskdone':''}"><button class="taskcheck" data-action="task:${t.id}" aria-label="Отметить задачу"></button><div class="rowmain"><div class="rowtitle">${esc(t.title)}</div><div class="sub">${t.due?dateFmt(t.due):'Без срока'}${obj(t.objectId)?` · ${esc(obj(t.objectId).name)}`:''}${t.person?` · ${esc(t.person)}`:''}</div></div><span class="badge ${t.status==='doing'?'':'gray'}">${t.status==='doing'?'В работе':t.status==='done'?'Готово':'К выполнению'}</span></div>`).join('')||'<div class="empty">Задач пока нет</div>'}</div>`}function renderTasks(){document.getElementById('tasks').innerHTML=`<div class="filters"><select id="taskFilter"><option value="open">Активные</option><option value="all">Все</option><option value="done">Готовые</option></select></div><div class="card section" id="taskList"></div>`;const show=()=>{let mode=document.getElementById('taskFilter').value,l=data.tasks.filter(t=>mode==='all'||(mode==='done'?t.status==='done':t.status!=='done')).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));document.getElementById('taskList').innerHTML=taskRows(l);bindActions()};document.getElementById('taskFilter').onchange=show;show()}function toggleTask(tid){let t=data.tasks.find(x=>x.id===tid);if(t){t.status=t.status==='done'?'todo':'done';save()}}
function renderNotes(){let ns=data.notes.slice().sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('notes').innerHTML=`<div class="card section">${ns.map(n=>`<div class="row"><div class="dot">▤</div><div class="rowmain"><div class="rowtitle">${esc(n.text)}</div><div class="sub">${dateFmt(n.date)}${obj(n.objectId)?` · ${esc(obj(n.objectId).name)}`:''}</div></div><div>${btn('Изменить','edit-note:'+n.id)} ${btn('×','del-note:'+n.id,'danger')}</div></div>`).join('')||'<div class="empty">Заметок пока нет. Добавьте заметку — она появится здесь и в карточке объекта.</div>'}</div>`}
function renderDirectory(){document.getElementById('directory').innerHTML=`<div class="grid cols"><div class="card section"><div class="sectionhead"><h2>Люди</h2>${btn('＋ Добавить','new-person','soft')}</div><div class="rows">${data.people.map((p,i)=>`<div class="row"><div class="dot">♙</div><div class="rowmain"><div class="rowtitle">${esc(p)}</div><div class="sub">Плательщик / получатель</div></div><button class="textbtn" data-action="del-person:${i}">Удалить</button></div>`).join('')||'<div class="empty">Добавьте людей, которые оплачивают расходы или получают деньги.</div>'}</div></div><div class="card section"><div class="sectionhead"><h2>Контрагенты</h2>${btn('＋ Добавить','new-counterparty','soft')}</div><div class="rows">${data.counterparties.map((p,i)=>`<div class="row"><div class="dot">⌂</div><div class="rowmain"><div class="rowtitle">${esc(p)}</div><div class="sub">Необязательный справочник</div></div><button class="textbtn" data-action="del-cp:${i}">Удалить</button></div>`).join('')||'<div class="empty">Контрагент при операции необязателен.</div>'}</div></div></div><div class="card section" style="margin-top:16px"><div class="sectionhead"><h2>Данные приложения</h2></div><div class="notice">Данные сохраняются в браузере на этом устройстве. Регулярно скачивайте резервную копию, чтобы перенести данные или восстановить их.</div>${btn('Скачать резервную копию','backup')}${btn('Восстановить из копии','restore')}${btn('Экспортировать операции CSV','export')}<input id="fileRestore" type="file" accept="application/json" class="hide"></div>`;bindActions();document.querySelectorAll('[data-action^="del-person:"]').forEach(b=>b.onclick=()=>{let i=+b.dataset.action.split(':')[1];if(confirm('Удалить человека из справочника?')){data.people.splice(i,1);save()}});document.querySelectorAll('[data-action^="del-cp:"]').forEach(b=>b.onclick=()=>{let i=+b.dataset.action.split(':')[1];if(confirm('Удалить контрагента из справочника?')){data.counterparties.splice(i,1);save()}});document.getElementById('fileRestore').onchange=restoreFile;document.getElementById('directory').insertAdjacentHTML('beforeend',cloudPanel());bindActions()}

function cloudPanel(){let u=window.fakturaUser;return `<div class="card section" style="margin-top:16px"><div class="sectionhead"><h2>Синхронизация между устройствами</h2><span class="badge ${u?'':'gray'}">${u?'Подключено':'Не подключено'}</span></div><div class="notice">${u?'Аккаунт: '+esc(u.email)+'. Изменения отправляются автоматически. На втором устройстве нажмите «Загрузить данные из облака».':'Для синхронизации подключите облачный проект Supabase. Локальные данные останутся доступными.'}</div><div class="actions">${u?btn('Синхронизировать сейчас','cloud-push','primary')+btn('Загрузить данные из облака','cloud-pull')+btn('Выйти','cloud-signout','danger'):btn('Настроить облако','sync-settings','primary')}</div><p class="sub">Подключение и публикация приложения требуют HTTPS. Не вставляйте секретный ключ проекта: нужен только publishable/anon key.</p></div>`}
function renderDetail(){let o=obj(detailId);if(!o){go('objects');return}let l=txs(o.id),inc=income(l),ex=expense(l),contractLeft=Math.max(0,Number(o.contract||0)-inc),extra=Math.max(0,inc-Number(o.contract||0));let head=`<div class="card detailhero"><div class="objtop"><div><span class="badge">${o.type==='client'?'Ремонт для клиента':'Своя квартира'}</span><h2 style="margin-top:10px">${esc(o.name)}</h2><div class="sub">${esc(o.address||'Адрес не указан')}</div></div>${btn(o.archived?'Восстановить':'В архив',o.archived?'archive':'archive','')}</div><div class="grid detailgrid">${o.type==='client'?`<div class="detailstat"><small>Договор</small><b>${money(o.contract)}</b></div><div class="detailstat"><small>Получено</small><b>${money(inc)}</b></div><div class="detailstat"><small>Остаток договора</small><b>${money(contractLeft)}${extra?` <small style="color:var(--red)">переплата ${money(extra)}</small>`:''}</b></div>`:`<div class="detailstat"><small>Покупка</small><b>${money(o.purchase)}</b></div><div class="detailstat"><small>Ожидаемая продажа</small><b>${money(o.expectedSale)}</b></div><div class="detailstat"><small>Прогноз результата</small><b>${money(Number(o.expectedSale||0)-Number(o.purchase||0)-ex-Number(o.extraInvestment||0))}</b></div>`}<div class="detailstat"><small>Фактические расходы</small><b>${money(ex)}</b></div><div class="detailstat"><small>Движение денег</small><b>${money(cash(l))}</b></div><div class="detailstat"><small>Операций</small><b>${l.length}</b></div></div><div class="sub" style="margin-top:12px">Движение денег — доходы минус расходы. Смета и договор сами по себе не меняют движение денег.</div></div><div class="tabs">${[['finance','Финансы'],['tasks','Задачи'],['notes','Заметки']].map(([k,t])=>`<button class="${detailTab===k?'active':''}" data-action="dtab:${k}">${t}</button>`).join('')}</div><div class="card section">${detailTab==='finance'?txRows(l):detailTab==='tasks'?taskRows(data.tasks.filter(t=>t.objectId===o.id)):`${data.notes.filter(n=>n.objectId===o.id).map(n=>`<div class="row"><div class="dot">▤</div><div class="rowmain"><div>${esc(n.text)}</div><div class="sub">${dateFmt(n.date)}</div></div></div>`).join('')||'<div class="empty">Заметок по объекту пока нет.</div>'}`}</div>`;document.getElementById('objectDetail').innerHTML=head;bindOpen()}
function modal(title,body,submitLabel='Сохранить'){document.getElementById('modal').innerHTML=`<h2>${title}</h2><form id="form">${body}<div class="modalfoot"><button type="button" class="btn" data-action="close">Отмена</button><button class="btn primary">${submitLabel}</button></div></form>`;document.getElementById('modalback').classList.add('show');bindActions()}function closeModal(){document.getElementById('modalback').classList.remove('show')}const objectOptions=selected=>`<option value="">Без объекта</option>${data.objects.filter(o=>!o.archived).map(o=>`<option value="${o.id}" ${o.id===selected?'selected':''}>${esc(o.name)}</option>`).join('')}`;
function objectForm(oid){let o=oid?obj(oid):null;modal(o?'Изменить объект':'Новый объект',`<div class="field"><label>Название объекта *</label><input name="name" required value="${esc(o?.name||'')}" placeholder="Например, квартира на Лесной"></div><div class="field"><label>Тип объекта</label><select name="type"><option value="client" ${o?.type!=='own'?'selected':''}>Ремонт для клиента</option><option value="own" ${o?.type==='own'?'selected':''}>Своя квартира для перепродажи</option></select></div><div class="field"><label>Адрес</label><input name="address" value="${esc(o?.address||'')}"></div><div class="formgrid"><div class="field"><label>Сумма договора</label><input name="contract" type="number" min="0" step="1" value="${o?.contract||''}"></div><div class="field"><label>Цена покупки (для своей квартиры)</label><input name="purchase" type="number" min="0" value="${o?.purchase||''}"></div><div class="field span2"><label>Ожидаемая цена продажи</label><input name="expectedSale" type="number" min="0" value="${o?.expectedSale||''}"></div></div>`,o?'Сохранить':'Создать объект');document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f);if(o)Object.assign(o,{...v,contract:+v.contract||0,purchase:+v.purchase||0,expectedSale:+v.expectedSale||0});else data.objects.unshift({id:id(),...v,contract:+v.contract||0,purchase:+v.purchase||0,expectedSale:+v.expectedSale||0,created:today(),archived:false});closeModal();save()}}
function txForm(tid){let t=tid?data.transactions.find(x=>x.id===tid):null;let oid=detailId||t?.objectId||'';modal(t?'Изменить операцию':'Новая операция',`<div class="formgrid"><div class="field"><label>Тип *</label><select name="type" id="txTypeForm"><option value="expense" ${t?.type!=='income'?'selected':''}>Расход</option><option value="income" ${t?.type==='income'?'selected':''}>Доход</option></select></div><div class="field"><label>Категория *</label><select name="category" id="txCategory" required></select></div><div class="field"><label>Сумма, ₽ *</label><input name="amount" type="number" min="1" step="1" required value="${t?.amount||''}"></div><div class="field"><label>Дата *</label><input name="date" type="date" required value="${t?.date||today()}"></div><div class="field"><label>Объект</label><select name="objectId">${objectOptions(oid)}</select></div><div class="field"><label>Контрагент <span class="sub">необязательно</span></label><select name="counterparty"><option value="">Не указывать</option>${data.counterparties.map(p=>`<option ${t?.counterparty===p?'selected':''}>${esc(p)}</option>`).join('')}<option value="__add">＋ Добавить контрагента</option></select></div><div class="field" id="personWrap"><label id="personLabel">Кто оплатил *</label><select name="person" id="personSelect"><option value="">Выберите человека</option>${data.people.map(p=>`<option ${t?.person===p?'selected':''}>${esc(p)}</option>`).join('')}<option value="__add">＋ Добавить человека</option></select></div><div class="field span2"><label>Назначение / комментарий</label><textarea name="purpose" placeholder="Например, плитка для санузла">${esc(t?.purpose||'')}</textarea></div><div class="field span2"><label>Чек или файл</label><input type="file" name="attachment" accept="image/*,.pdf"><small class="sub">В этой версии файл прикрепляется локально и занимает место в браузере.</small></div></div>`,t?'Сохранить':'Добавить операцию');let type=document.getElementById('txTypeForm'),cat=document.getElementById('txCategory'),who=document.getElementById('personSelect'),cp=document.querySelector('[name=counterparty]');let categories={expense:['Материалы','Работы / оплата рабочих','Доставка','Инструменты','Услуги','Другое'],income:['Аванс','Оплата работ','Возмещение материалов','Частичная оплата','Окончательный расчёт','Другое']};function updateType(){let prev=cat.value;cat.innerHTML=categories[type.value].map(x=>`<option ${x===t?.category||x===prev?'selected':''}>${x}</option>`).join('');document.getElementById('personLabel').textContent=type.value==='expense'?'Кто оплатил *':'Кто получил деньги *';who.required=type.value==='expense'}type.onchange=updateType;updateType();cp.onchange=()=>{if(cp.value==='__add')directoryForm('counterparties',()=>txForm(tid))};who.onchange=()=>{if(who.value==='__add')directoryForm('people',()=>txForm(tid))};document.querySelector('#form .modalfoot').insertAdjacentHTML('afterbegin','<button type="button" class="btn soft" id="signupBtn">Создать аккаунт</button>');document.getElementById('signupBtn').onclick=async()=>{let f=Object.fromEntries(new FormData(document.getElementById('form')));if(!document.getElementById('form').reportValidity())return;localStorage.setItem('faktura_cloud_config',JSON.stringify({url:f.url.replace(/\/$/,''),key:f.key,email:f.email}));closeModal();await loadCloudClient(f.url.replace(/\/$/,''),f.key);if(cloudClient)await cloudAuth('signup',f.email,f.password)};document.getElementById('form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f);if(v.counterparty==='__add'||v.person==='__add')return;if(v.type==='expense'&&!v.person){showToast('Выберите, кто оплатил расход');return}let file=e.target.elements.attachment.files[0],attachment=t?.attachment||'';if(file){if(file.size>2*1024*1024){showToast('Файл больше 2 МБ — выберите изображение поменьше');return}attachment=await fileToData(file)}let rec={id:t?.id||id(),...v,amount:+v.amount,attachment};if(t)Object.assign(t,rec);else data.transactions.unshift(rec);closeModal();save()}}
function taskForm(){modal('Новая задача',`<div class="field"><label>Задача *</label><input name="title" required placeholder="Например, принять сантехнику"></div><div class="field"><label>Объект</label><select name="objectId">${objectOptions('')}</select></div><div class="formgrid"><div class="field"><label>Срок</label><input name="due" type="date"></div><div class="field"><label>Ответственный</label><select name="person"><option value="">Не назначен</option>${data.people.map(p=>`<option>${esc(p)}</option>`).join('')}<option value="__add">＋ Добавить человека</option></select></div></div>`,`Создать задачу`);let p=document.querySelector('[name=person]');p.onchange=()=>{if(p.value==='__add')directoryForm('people',taskForm)};document.getElementById('form').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(v.person==='__add')return;data.tasks.unshift({id:id(),...v,status:'todo',created:today()});closeModal();save()}}
function noteForm(nid){let n=nid?data.notes.find(x=>x.id===nid):null;modal(n?'Изменить заметку':'Новая заметка',`<div class="field"><label>Заметка *</label><textarea name="text" required placeholder="Запишите важную информацию">${esc(n?.text||'')}</textarea></div><div class="field"><label>Объект</label><select name="objectId">${objectOptions(detailId||n?.objectId||'')}</select></div>`,n?'Сохранить':'Добавить заметку');document.getElementById('form').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(n)Object.assign(n,v);else data.notes.unshift({id:id(),...v,date:today()});closeModal();save()}}function deleteNote(nid){if(confirm('Удалить заметку?')){data.notes=data.notes.filter(n=>n.id!==nid);save()}}
function directoryForm(kind,after){let person=kind==='people',title=person?'Добавить человека':'Добавить контрагента';modal(title,`<div class="field"><label>${person?'Имя человека':'Название контрагента'} *</label><input name="value" required placeholder="Введите название"></div>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let v=new FormData(e.target).get('value').trim();let arr=person?data.people:data.counterparties;if(v&&!arr.includes(v))arr.push(v);closeModal();save();if(after)after()}}

let cloudClient=null,cloudMode=null,cloudTimer=null;
function cloudForm(){let c={};try{c=JSON.parse(localStorage.getItem('faktura_cloud_config')||'{}')}catch{};modal('Подключение облака',`<div class="notice">Создайте проект Supabase и таблицу по инструкции рядом с приложением. В браузере хранится только адрес проекта и публичный ключ; пароль вводится только при входе.</div><div class="field"><label>Адрес проекта</label><input name="url" required type="url" placeholder="https://xxxx.supabase.co" value="${esc(c.url||'')}"></div><div class="field"><label>Публичный ключ проекта</label><input name="key" required value="${esc(c.key||'')}" placeholder="sb_publishable_…"></div><div class="field"><label>Email</label><input name="email" required type="email" value="${esc(c.email||'')}"></div><div class="field"><label>Пароль облачного аккаунта</label><input name="password" required type="password" autocomplete="current-password"></div><div class="sub">Пароль не сохраняется приложением. Supabase хранит сессию входа на устройстве.</div>`,'Войти или создать аккаунт');document.getElementById('form').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));localStorage.setItem('faktura_cloud_config',JSON.stringify({url:f.url.replace(/\/$/,''),key:f.key,email:f.email}));closeModal();await loadCloudClient(f.url.replace(/\/$/,''),f.key);if(cloudClient)await cloudAuth('signin',f.email,f.password)}}
async function loadCloudClient(url,key){if(!window.supabase){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)}).catch(()=>{showToast('Не удалось загрузить облачный клиент');return})}if(window.supabase)cloudClient=window.supabase.createClient(url,key)}
async function cloudAuth(mode,email,password){try{if(!cloudClient){let c=JSON.parse(localStorage.getItem('faktura_cloud_config')||'{}');if(!c.url||!c.key){cloudForm();return}await loadCloudClient(c.url,c.key)}if(!cloudClient)return;let credentials={email:email||JSON.parse(localStorage.getItem('faktura_cloud_config')||'{}').email,password};let result=mode==='signup'?await cloudClient.auth.signUp(credentials):await cloudClient.auth.signInWithPassword(credentials);if(result.error)throw result.error;let session=result.data.session;if(!session){showToast('Проверьте почту, чтобы подтвердить регистрацию');render();return}window.fakturaUser=result.data.user;closeModal();render();showToast('Вход выполнен. Выберите направление синхронизации')}catch(e){alert('Не удалось подключиться: '+(e.message||e))}}
async function initCloudSession(){try{let c=JSON.parse(localStorage.getItem('faktura_cloud_config')||'{}');if(!c.url||!c.key)return;await loadCloudClient(c.url,c.key);if(!cloudClient)return;let {data}=await cloudClient.auth.getUser();if(data.user){window.fakturaUser=data.user;render()}}catch{}}
async function cloudSignout(){if(cloudClient)await cloudClient.auth.signOut();window.fakturaUser=null;cloudMode='push';render();showToast('Вы вышли из облака')}
async function cloudTransfer(direction){try{if(!cloudClient){let c=JSON.parse(localStorage.getItem('faktura_cloud_config')||'{}');await loadCloudClient(c.url,c.key)}if(!cloudClient)throw Error('Сначала подключите облако');let {data:userData}=await cloudClient.auth.getUser();if(!userData.user)throw Error('Войдите в облачный аккаунт');window.fakturaUser=userData.user;if(direction==='push'){let {error}=await cloudClient.from('faktura_data').upsert({user_id:userData.user.id,payload:data,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;cloudMode='push';showToast('Данные отправлены в облако')}else{let {data:row,error}=await cloudClient.from('faktura_data').select('payload,updated_at').eq('user_id',userData.user.id).maybeSingle();if(error)throw error;if(!row){showToast('В облаке пока нет копии. Сначала отправьте данные');return}if(!confirm('Заменить данные на этом устройстве копией из облака?'))return;data=row.payload;localStorage.setItem(KEY,JSON.stringify(data));cloudMode='push';render();showToast('Данные загружены из облака')} }catch(e){alert('Синхронизация не выполнена: '+(e.message||e))}}
function queueCloudSync(){if(!cloudClient||!window.fakturaUser||cloudMode!=='push')return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudTransfer('push'),900)}

function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});download(blob,'faktura-backup-'+today()+'.json');showToast('Резервная копия скачана')}function exportData(){let rows=[['Дата','Тип','Категория','Сумма','Объект','Контрагент','Кто','Назначение'],...data.transactions.map(t=>[t.date,t.type==='income'?'Доход':'Расход',t.category,t.amount,obj(t.objectId)?.name||'',t.counterparty||'',t.person||'',t.purpose||''])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'faktura-finance-'+today()+'.csv')}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}function fileToData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}function restoreFile(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.objects)||!Array.isArray(d.transactions))throw 0;data=d;save();showToast('Данные восстановлены')}catch{alert('Файл не похож на резервную копию Faktura')}};r.readAsText(file)}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.installPrompt=e;});if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});document.getElementById('modalback').onclick=e=>{if(e.target.id==='modalback')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();initCloudSession();
})();
</script></body></html>

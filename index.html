ectDetail';render()}function header(title,crumb,actions=''){document.getElementById('pageTitle').textContent=title;document.getElementById('crumb').textContent=crumb;document.getElementById('topActions').innerHTML=actions;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(current).classList.add('active');nav()}function btn(label,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${label}</button>`}function bindActions(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action))}function showToast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),2200)}function action(a){if(a==='new-object')objectForm();else if(a==='new-tx')txForm();else if(a==='new-expense')txForm(null,'expense');else if(a==='new-income')txForm(null,'income');else if(a==='new-task')taskForm();else if(a==='new-note')noteForm();else if(a==='new-person')directoryForm('people');else if(a==='new-counterparty')directoryForm('counterparties');else if(a==='export')exportData();else if(a==='sync-settings')cloudForm();else if(a==='cloud-signin')cloudAuth('signin');else if(a==='cloud-signup')cloudAuth('signup');else if(a==='cloud-push')cloudTransfer('push');else if(a==='cloud-pull')cloudTransfer('pull');else if(a==='cloud-signout')cloudSignout();else if(a==='backup')backup();else if(a==='restore')document.getElementById('fileRestore').click();else if(a==='close')closeModal();else if(a==='archive'){let o=obj(detailId);o.archived=!o.archived;save();showToast(o.archived?'Объект перемещён в архив':'Объект восстановлен')}else if(a==='tab'){detailTab=document.querySelector('[data-tab="'+a+'"]')?.dataset.value||detailTab} else if(a.startsWith('dtab:')){detailTab=a.split(':')[1];render()}else if(a.startsWith('edit-object:'))objectForm(a.split(':')[1]);else if(a.startsWith('tx:'))txForm(a.slice(3));else if(a.startsWith('task:'))toggleTask(a. function stat(label,value,note=''){return `<div class="card stat"><label>${label}</label><strong>${value}</strong>${note?`<small>${note}</small>`:''}</div>`}function objectCard(o){let list=txs(o.id),inc=income(list),ex=expense(list),openTasks=data.tasks.filter(t=>t.objectId===o.id&&t.status!=='done').length,noteCount=data.notes.filter(n=>n.objectId===o.id).length;let facts=o.type==='client'?`<span>Договор <b>${money(o.contract)}</b></span><span>Получено <b>${money(inc)}</b></span>`:`<span>Покупка <b>${money(o.purchase)}</b></span><span>План продажи <b>${money(o.expectedSale)}</b></span>`;return `<article class="object" data-object="${o.id}"><div class="objtop"><div class="objname">${esc(o.name)}</div><span class="badge ${o.archived?'gray':''}">${o.archived?'Архив':o.type==='client'?'Ремонт для клиента':'Своя квартира'}</span></div><div class="objmeta">${facts}<span>Расходы <b>${money(ex)}</b></span></div><div class="sub" style="margin-top:9px">${openTasks} активных задач · ${noteCount} заметок · ${list.length} операций</div></article>`}function renderDashboard(){let list=txs(),ts=data.tasks.filter(t=>t.status!=='done').sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')),os=activeObjects();document.getElementById('dashboard').innerHTML=`<div class="grid cols"><div class="card section"><div class="sectionhead"><h2>Ближайшие задачи</h2><a href="#" data-go="tasks">Все задачи →</a></div><p class="sub" style="margin-top:-8px;margin-bottom:10px">Просроченные и сегодняшние задачи расположены сверху.</p>${taskRows(ts.slice(0,7))}</div><div class="card section"><div class="sectionhead"><h2>Быстрая запись</h2></div><div class="quickgrid">${btn('＋ Расход','new-expense','primary')}${btn('＋ Доход','new-income')}${btn('＋ Задача','new-task')}${btn('＋ Заметка','new-note')}</div><p class="sub" style="margin-top:12px">Укажите объект, кто оплатил или получил деньги, и прикрепите чек при необходимости.</p></div></div><div class="card welcome" style="margin-top:16px"><h2>Как посмот function taskRows(list){return `<div class="rows">${list.map(t=>{let late=t.status!=='done'&&t.due&&t.due<today(),when=!t.due?'Без срока':late?'Просрочена · '+dateFmt(t.due):t.due===today()?'Сегодня':dateFmt(t.due),o=obj(t.objectId);return `<div class="row ${t.status==='done'?'taskdone':''} ${late?'taskoverdue':''}"><button class="taskcheck" data-action="task:${t.id}" aria-label="Отметить задачу"></button><div class="rowmain"><div class="rowtitle">${esc(t.title)}</div><div class="sub">${when}${o?` · <a href="#" data-open="${o.id}" style="color:var(--green);text-decoration:none">${esc(o.name)}</a>`:''}${t.person?` · ${esc(t.person)}`:''}</div></div><span class="badge ${t.status==='doing'?'':'gray'}">${t.status==='doing'?'В работе':t.status==='done'?'Готово':'К выполнению'}</span></div>`}).join('')||'<div class="empty">Задач пока нет</div>'}</div>`}function renderTasks(){document.getElementById('tasks').innerHTML=`<div class="filters"><select id="taskFilter"><option value="open">Активные</option><option value="all">Все</option><option value="done">Готовые</option></select></div><div class="card section" id="taskList"></div>`;const show=()=>{let mode=document.getElementById('taskFilter').value,l=data.tasks.filter(t=>mode==='all'||(mode==='done'?t.status==='done':t.status!=='done')).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));document.getElementById('taskList').innerHTML=taskRows(l);bindActions();bindOpen()};document.getElementById('taskFilter').onchange=show;show()}function toggleTask(tid){let t=data.tasks.find(x=>x.id===tid);if(t){t.status=t.status==='done'?'todo':'done';save()}}

async function cloudAuth(mode,email,password){try{if(!cloudClient){let c=JSON.parse(localStorage.getItem('faktura_cloud_config')||'{}');if(!c.url||!c.key){cloudForm();return}await loadCloudClient(c.url,c.key)}if(!cloudClient)return;let credentials={email:email||JSON.parse(localStorage.getItem('faktura_cloud_config')||'{}').email,password};let result=mode==='signup'?await cloudClient.auth.signUp(credentials):await cloudClient.auth.signInWithPassword(credentials);if(result.error)throw result.error;let session=result.data.session;if(!session){showToast('Проверьте почту, чтобы подтвердить регистрацию');render();return}window.fakturaUser=result.data.user;closeModal();render();showToast('Вход выполнен. Выберите направление синхронизации')}catch(e){alert('Не удалось подключиться: '+(e.message||e))}}

async function cloudTransfer(direction){try{if(!cloudClient){let c=JSON.parse(localStorage.getItem('faktura_cloud_config')||'{}');await loadCloudClient(c.url,c.key)}if(!cloudClient)throw Error('Сначала подключите облако');let {data:userData}=await cloudClient.auth.getUser();if(!userData.user)throw Error('Войдите в облачный аккаунт');window.fakturaUser=userData.user;if(direction==='push'){let {error}=await cloudClient.from('faktura_data').upsert({user_id:userData.user.id,payload:data,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;cloudMode='push';showToast('Данные отправлены в облако')}else{let {data:row,error}=await cloudClient.from('faktura_data').select('payload,updated_at').eq('user_id',userData.user.id).maybeSingle();if(error)throw error;if(!row){showToast('В облаке пока нет копии. Сначала отправьте данные');return}if(!confirm('Заменить данные на этом устройстве копией из облака?'))return;data=row.payload;localStorage.setItem(KEY,JSON.stringify(data));cloudMode='push';render();showToast('Данные загружены из облака')} }catch(e){alert('Синхронизация не выполнена: '+(e.message||e))}}

function est(eid){return data.estimates.find(x=>x.id===eid)}
function roomMetrics(r){let l=+r.l||0,w=+r.w||0,h=+r.h||0;return{floor:l*w,walls:Math.max(0,2*(l+w)*h-(+r.openings||0)),perimeter:2*(l+w),height:h}}
function itemQty(i,e){let r=e.rooms.find(x=>x.id===i.room),m=r?roomMetrics(r):{floor:0,walls:0,perimeter:0,height:0},p=i.params||{};if(i.calc!=='manual'&&i.override!==''&&i.override!=null)return +i.override;if(i.calc==='floor')return m.floor;if(i.calc==='walls')return m.walls;if(i.calc==='perimeter')return m.perimeter;if(i.calc==='tile')return m.walls*(1+(+p.waste||10)/100);if(i.calc==='grout'){let a=+p.a||300,b=+p.b||300,j=+p.j||2,d=+p.d||5;return m.walls*((a+b)/(a*b))*j*d*1.6}if(i.calc==='wallpaper'){let rw=(+p.rw||53)/100,rl=+p.rl||10,rp=(+p.rp||0)/100,drop=rp?Math.ceil(m.height/rp)*rp:m.height;return rw&&drop?Math.ceil(m.perimeter/rw/Math.max(1,Math.floor(rl/drop))):0}return +i.qty||0}
function estTotal(e,k){return e.items.filter(i=>!k||i.kind===k).reduce((s,i)=>s+(+i.price||0)*itemQty(i,e),0)}
function estGo(id){estimateId=id||null;current='estimates';render()}
function renderEstimates(){let h=document.getElementById('estimates');if(estimateId){renderEstimate(h);return}let a=data.estimates;h.innerHTML='<div class="notice">Создайте черновик, добавьте замеры и позиции. После согласия смета станет объектом.</div><div class="grid estlist">'+a.slice().reverse().map(e=>'<button class="card estcard" data-est="'+e.id+'"><span class="badge '+(e.objectId?'':'gray')+'">'+(e.objectId?'Объект':'Черновик')+'</span><strong>'+esc(e.name)+'</strong><small>'+esc(e.address||'Адрес не указан')+' · '+e.rooms.length+' помещений · '+e.items.length+' позиций</small><b>'+money(estTotal(e))+'</b></button>').join('')+'</div>'+(a.length?'':'<div class="card empty">Расчётов пока нет. Начните с клиента и адреса.</div>')+'<div class="card section" style="margin-top:16px"><div class="sectionhead"><h2>Мои расценки</h2><button class="btn soft" data-action="rate-add">＋ Расценка</button></div><div class="rateslist">'+data.rates.map(r=>'<div class="row rate-row"><div class="dot">'+(r.kind==='work'?'⚒':'▧')+'</div><div class="rowmain"><div class="rowtitle">'+esc(r.name)+'</div><div class="sub">'+(r.kind==='work'?'Работа':'Материал')+' · '+money(r.price)+' / '+esc(r.unit)+'</div></div><button class="textbtn" data-action="rate-edit:'+r.id+'">Изменить</button></div>').join('')+'</div></div>';h.querySelectorAll('[data-est]').forEach(b=>b.onclick=()=>estGo(b.dataset.est))}
function renderEstimate(h){let e=est(estimateId);if(!e){estGo(null);return}let w=estTotal(e,'work'),m=estTotal(e,'material');h.innerHTML='<div class="esttoolbar"><button class="btn" data-action="est-back">← Все расчёты</button><div><button class="btn" onclick="window.print()">Печать / PDF</button><button class="btn primary" data-action="est-convert">'+(e.objectId?'Открыть объект':'Клиент согласен · создать объект')+'</button></div></div><div class="card section"><div class="sectionhead"><h2>'+esc(e.name)+'</h2><button class="textbtn" data-action="est-edit">Изменить данные</button></div><div class="sub">'+esc(e.address||'Адрес не указан')+(e.phone?' · '+esc(e.phone):'')+'</div><div class="grid detailgrid"><div class="detailstat"><small>Работы</small><b>'+money(w)+'</b></div><div class="detailstat"><small>Материалы</small><b>'+money(m)+'</b></div><div class="detailstat"><small>Итого</small><b>'+money(w+m)+'</b></div></div></div><div class="grid estcols"><div class="card section"><div class="sectionhead"><h2>Помещения и замеры</h2><button class="btn soft" data-action="room-add">＋ Помещение</button></div>'+e.rooms.map(r=>{let x=roomMetrics(r);return '<div class="roomcard"><div class="objtop"><b>'+esc(r.name)+'</b><button class="textbtn" data-action="room-edit:'+r.id+'">Изменить</button></div><div class="sub">'+r.l+' × '+r.w+' × '+r.h+' м · стены '+x.walls.toFixed(2)+' м² · пол '+x.floor.toFixed(2)+' м² · периметр '+x.perimeter.toFixed(2)+' м</div></div>'}).join('')+(e.rooms.length?'':'<div class="empty">Добавьте комнату, длину, ширину и высоту.</div>')+'</div><div class="card section"><div class="sectionhead"><h2>Работы и материалы</h2><button class="btn soft" data-action="item-add">＋ Позиция</button></div>'+e.items.map(i=>'<div class="estline"><div><span class="badge '+(i.kind==='work'?'':'gray')+'">'+(i.kind==='work'?'Работа':'Материал')+'</span><strong>'+esc(i.name)+'</strong><small>'+itemQty(i,e).toFixed(i.unit==='шт.'||i.unit==='рулон'?0:2)+' '+esc(i.unit)+' × '+money(i.price)+'</small></div><b>'+money(itemQty(i,e)*i.price)+'</b><button class="textbtn" data-action="item-edit:'+i.id+'">Изменить</button></div>').join('')+(e.items.length?'':'<div class="empty">Добавьте работу или материал из своего прайса.</div>')+'</div></div><div class="notice"><b>Формулы:</b> стены = периметр × высота − проёмы. Плитка считается с запасом; затирка — по размеру плитки и шву; обои — по ширине и длине рулона, высоте комнаты и раппорту рисунка. Любое количество можно скорректировать вручную.</div>';bindActions()}
function estForm(eid){let e=eid?est(eid):null;modal(e?'Данные расчёта':'Новый расчёт','<div class="field"><label>Клиент или название *</label><input name="name" required value="'+esc(e?.name||'')+'" placeholder="Например, ремонт ванной у Анны"></div><div class="field"><label>Адрес</label><input name="address" value="'+esc(e?.address||'')+'"></div><div class="field"><label>Телефон</label><input name="phone" type="tel" value="'+esc(e?.phone||'')+'"></div><div class="field"><label>Договорённости / комментарий</label><textarea name="comment">'+esc(e?.comment||'')+'</textarea></div>',e?'Сохранить':'Начать расчёт');document.getElementById('form').onsubmit=x=>{x.preventDefault();let v=Object.fromEntries(new FormData(x.target));if(e)Object.assign(e,v);else{e={id:id(),...v,rooms:[],items:[],created:today()};data.estimates.push(e)}closeModal();save();if(!eid)estGo(e.id)}}
function roomForm(rid){let e=est(estimateId),r=e.rooms.find(x=>x.id===rid);modal(r?'Изменить помещение':'Новое помещение','<div class="field"><label>Комната *</label><input name="name" required value="'+esc(r?.name||'')+'" placeholder="Ванная"></div><div class="formgrid"><div class="field"><label>Длина, м</label><input name="l" type="number" step=".01" value="'+(r?.l||'')+'"></div><div class="field"><label>Ширина, м</label><input name="w" type="number" step=".01" value="'+(r?.w||'')+'"></div><div class="field"><label>Высота, м</label><input name="h" type="number" step=".01" value="'+(r?.h||'')+'"></div><div class="field"><label>Проёмы, м²</label><input name="openings" type="number" step=".01" value="'+(r?.openings||'')+'"></div></div>',r?'Сохранить':'Добавить помещение');document.getElementById('form').onsubmit=x=>{x.preventDefault();let v=Object.fromEntries(new FormData(x.target));['l','w','h','openings'].forEach(k=>v[k]=+v[k]||0);if(r)Object.assign(r,v);else e.rooms.push({id:id(),...v});closeModal();save()}}
function rateForm(rid){let r=data.rates.find(x=>x.id===rid);modal(r?'Изменить расценку':'Новая расценка','<div class="field"><label>Тип</label><select name="kind"><option value="work">Работа</option><option value="material">Материал</option></select></div><div class="field"><label>Название *</label><input name="name" required value="'+esc(r?.name||'')+'"></div><div class="formgrid"><div class="field"><label>Единица</label><select name="unit">'+['м²','п.м.','шт.','кг','рулон','комплект'].map(x=>'<option '+((r?.unit||'м²')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Цена, ₽</label><input name="price" type="number" value="'+(r?.price||'')+'"></div></div>',r?'Сохранить':'Добавить');if(r)document.querySelector('[name=kind]').value=r.kind;document.getElementById('form').onsubmit=x=>{x.preventDefault();let v=Object.fromEntries(new FormData(x.target));v.price=+v.price||0;if(r)Object.assign(r,v);else data.rates.push({id:id(),...v});closeModal();save()}}
function itemForm(iid){let e=est(estimateId),i=iid?e.items.find(x=>x.id===iid):null;let rates=data.rates.map(r=>'<option value="'+r.id+'" '+(i?.rateId===r.id?'selected':'')+'>'+esc(r.name)+' · '+money(r.price)+'/'+esc(r.unit)+'</option>').join(''),rooms='<option value="">Не привязывать</option>'+e.rooms.map(r=>'<option value="'+r.id+'" '+(i?.room===r.id?'selected':'')+'>'+esc(r.name)+'</option>').join('');modal(i?'Изменить позицию':'Новая позиция','<div class="field"><label>Готовая расценка</label><select name="rateId" id="ratePick"><option value="">Своя позиция</option>'+rates+'</select></div><div class="formgrid"><div class="field"><label>Раздел</label><select name="kind"><option value="work">Работы</option><option value="material">Материалы</option></select></div><div class="field"><label>Единица</label><select name="unit">'+['м²','п.м.','шт.','кг','рулон','комплект'].map(x=>'<option '+((i?.unit||'м²')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><div class="field"><label>Наименование *</label><input name="name" required value="'+esc(i?.name||'')+'"></div><div class="formgrid"><div class="field"><label>Цена, ₽</label><input name="price" type="number" value="'+(i?.price||'')+'"></div><div class="field"><label>Количество считать</label><select name="calc" id="qtyMode"><option value="manual">Вручную</option><option value="floor">Площадь пола</option><option value="walls">Площадь стен</option><option value="perimeter">Периметр</option><option value="tile">Плитка + запас</option><option value="grout">Затирка по шву</option><option value="wallpaper">Рулоны обоев</option></select></div></div><div class="field"><label>Помещение</label><select name="room">'+rooms+'</select></div><div id="extraCalc"></div><div class="field"><label>Количество вручную</label><input name="qty" type="number" step=".01" value="'+(i?.override??(i?.calc==='manual'?i?.qty:(!i?1:'')))+'"></div><div class="notice">Поштучные позиции, например розетки, вводятся вручную.</div>',i?'Сохранить':'Добавить позицию');if(i){document.querySelector('[name=kind]').value=i.kind;document.querySelector('[name=calc]').value=i.calc}let pick=document.getElementById('ratePick');pick.onchange=()=>{let r=data.rates.find(x=>x.id===pick.value);if(r){document.querySelector('[name=name]').value=r.name;document.querySelector('[name=kind]').value=r.kind;document.querySelector('[name=unit]').value=r.unit;document.querySelector('[name=price]').value=r.price}};function extra(){let c=document.getElementById('qtyMode').value,p=i?.params||{};document.getElementById('extraCalc').innerHTML=c==='grout'?'<div class="formgrid"><div class="field"><label>Плитка A, мм</label><input name="a" type="number" value="'+(p.a||300)+'"></div><div class="field"><label>Плитка B, мм</label><input name="b" type="number" value="'+(p.b||300)+'"></div><div class="field"><label>Шов, мм</label><input name="j" type="number" value="'+(p.j||2)+'"></div><div class="field"><label>Глубина, мм</label><input name="d" type="number" value="'+(p.d||5)+'"></div></div>':c==='tile'?'<div class="field"><label>Запас, %</label><input name="waste" type="number" value="'+(p.waste||10)+'"></div>':c==='wallpaper'?'<div class="formgrid"><div class="field"><label>Ширина рулона, см</label><input name="rw" type="number" value="'+(p.rw||53)+'"></div><div class="field"><label>Длина рулона, м</label><input name="rl" type="number" value="'+(p.rl||10)+'"></div><div class="field"><label>Раппорт, см (0 если нет)</label><input name="rp" type="number" value="'+(p.rp||0)+'"></div></div>':''}document.getElementById('qtyMode').onchange=()=>{extra();let q=document.querySelector('[name=qty]');if(q){if(document.getElementById('qtyMode').value!=='manual'&&q.value==='1'&&!i)q.value='';else if(document.getElementById('qtyMode').value==='manual'&&!q.value)q.value=i?.qty||1}};extra();document.getElementById('form').onsubmit=x=>{x.preventDefault();let v=Object.fromEntries(new FormData(x.target)),p={a:+v.a||300,b:+v.b||300,j:+v.j||2,d:+v.d||5,waste:+v.waste||10,rw:+v.rw||53,rl:+v.rl||10,rp:+v.rp||0},z={id:i?.id||id(),rateId:v.rateId,kind:v.kind,name:v.name,unit:v.unit,price:+v.price||0,calc:v.calc,qty:+v.qty||0,override:v.calc==='manual'?'':v.qty,room:v.room,params:p};if(i)Object.assign(i,z);else e.items.push(z);closeModal();save()}}
function convertEst(){let e=est(estimateId);if(e.objectId){openObject(e.objectId);return}if(!confirm('Создать объект из сметы?'))return;let o={id:id(),name:e.name,address:e.address,phone:e.phone,type:'client',contract:estTotal(e),purchase:0,expectedSale:0,created:today(),archived:false,estimateId:e.id};data.objects.unshift(o);e.objectId=o.id;save();openObject(o.id)}
function estAction(a){if(a==='new-estimate')estForm();else if(a==='est-back')estGo(null);else if(a==='est-edit')estForm(estimateId);else if(a==='room-add')roomForm();else if(a.startsWith('room-edit:'))roomForm(a.split(':')[1]);else if(a==='item-add')itemForm();else if(a.startsWith('item-edit:'))itemForm(a.split(':')[1]);else if(a==='est-convert')convertEst();else if(a==='rate-add')rateForm();else if(a.startsWith('rate-edit:'))rateForm(a.split(':')[1])}


const originalAction=action;
action=function(a){if(a==='new-estimate'||a==='est-back'||a==='est-edit'||a==='room-add'||a==='item-add'||a==='est-convert'||a==='rate-add'||a.startsWith('room-edit:')||a.startsWith('item-edit:')||a.startsWith('rate-edit:')){estAction(a);return}originalAction(a)};
render=function(){let title=current==='estimates'?(estimateId?(est(estimateId)?.name||'Расчёт'):'Расчёт'):({dashboard:'Сегодня',objects:'Объекты',finance:'Финансы',tasks:'Задачи',notes:'Заметки',directory:'Справочники',objectDetail:obj(detailId)?.name||'Объект'})[current];let acts={dashboard:btn('＋ Объект','new-object','secondary-mobile'),objects:btn('＋ Новый объект','new-object','primary'),estimates:estimateId?'':btn('＋ Новый расчёт','new-estimate','primary'),finance:btn('＋ Операция','new-tx','primary'),tasks:btn('＋ Задача','new-task','primary'),notes:btn('＋ Заметка','new-note','primary'),directory:btn('＋ Человек','new-person')+btn('＋ Контрагент','new-counterparty','primary'),objectDetail:btn('＋ Операция','new-tx','primary')+btn('Изменить','edit-object:'+detailId)};header(title,current==='estimates'?'Смета до начала ремонта':current==='objectDetail'?'Объекты':'Faktura',acts[current]||'');if(current==='dashboard')renderDashboard();if(current==='objects')renderObjects();if(current==='estimates')renderEstimates();if(current==='finance')renderFinance();if(current==='tasks')renderTasks();if(current==='notes')renderNotes();if(current==='directory')renderDirectory();if(current==='objectDetail')renderDetail();bindActions()};

render();initCloudSession();
})();
</script></body></html>
